name: Aktualizace Education Radaru

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-radar.yml"
      - "scripts/**"
      - "tests/**"
  schedule:
    - cron: "7 7,12 * * *"
      timezone: "Europe/Prague"

concurrency:
  group: education-radar-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Aktualizovat a otestovat report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Nastavit Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Spustit testy před aktualizací
        run: node --test tests/*.test.mjs
      - name: Aktualizovat report
        run: node scripts/update-radar.mjs
      - name: Spustit testy po aktualizaci
        run: node --test tests/*.test.mjs
      - name: Ověřit výstup
        run: |
          test -s index.html
          test -s data/automation-status.json
          grep -q 'class="dateBadge">Aktualizováno' index.html
          grep -q 'Europe/Prague' index.html
          grep -q '"schemaVersion": 1' data/automation-status.json
      - name: Uložit aktualizaci do main
        run: |
          git config user.name "education-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/automation-status.json
          if git diff --cached --quiet; then
            echo "Report již odpovídá aktuálnímu běhu."
          else
            git commit -m "Automaticky aktualizovat Education Radar"
            git push origin HEAD:main
          fi
      - name: Připravit statický web
        run: |
          mkdir -p _site
          cp index.html styles-v4.css styles-v5.css _site/
          cp -R search data _site/
          touch _site/.nojekyll
      - name: Nastavit GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Nahrát Pages artefakt
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Nasadit veřejný web
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nasadit GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
